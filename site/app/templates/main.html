<!DOCTYPE html>
<html lang="en">
    <head>
             <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
            <meta http-equiv="X-UA-Compatible" content="ie=edge">
            {#импортируем bootstrap с готовыми примерами #}
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
<body>
        <div class="container">
        <h1>вставьте ссылку</h1>
        <form action="/" method="post">
            <input type="text" name="title" id="title" class="form-control" placeholder="ссылка" required><br>
            <button type="submit" class="btn btn-primary">Сократить</button>

        </form>
    </div>
{% if short_url %}
    <div class="mt-4 alert alert-success">
        <p>Ваша сокращенная ссылка:</p>
        <a href="{{ request.host_url }}{{ short_url }}" target="_blank">
            {{ request.host_url }}{{ short_url }}
        </a>
    </div>
{% endif %}

</body>
</html>
